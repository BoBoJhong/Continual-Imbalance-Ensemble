[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "continual-imbalance-ensemble"
version = "0.1.0"
description = "Continual ensemble learning for imbalanced non-stationary data"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "numpy==2.4.2",
    "pandas==2.3.3",
    "scipy==1.17.1",
    "scikit-learn==1.8.0",
    "imbalanced-learn==0.14.1",
    "lightgbm==4.6.0",
    "xgboost==3.2.0",
    "pyyaml==6.0.3",
    "shap==0.52.0",
    "matplotlib==3.10.8",
    "seaborn==0.13.2",
    "openpyxl==3.1.5",
    "joblib==1.5.3",
    "tqdm==4.67.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.2",
    "pytest-cov==4.1.0",
    "ruff==0.15.11",
]

[tool.setuptools.packages.find]
include = ["src", "src.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.black]
line-length = 100
target-version = ["py311", "py312", "py313", "py314"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]
