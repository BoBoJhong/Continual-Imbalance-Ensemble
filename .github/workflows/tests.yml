name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Run tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          LOKY_MAX_CPU_COUNT: "1"
        run: python -m pytest -q -p no:cacheprovider
      - name: Compile maintained Python sources
        run: python -m compileall -q src experiments scripts
      - name: Validate maintained experiment manifest
        run: python scripts/run/run_all_experiments.py --list
      - name: Validate checked-in result CSV files
        run: python scripts/analysis/validate_result_artifacts.py results --strict
